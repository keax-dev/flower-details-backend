# Server
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

# Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
management.metrics.tags.application=${spring.application.name}

# Local PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flower_details}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=FlowerDetailsDevPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.highlight_sql=${HIBERNATE_HIGHLIGHT_SQL:true}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=${HIBERNATE_DEFAULT_BATCH_FETCH_SIZE:50}
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:0}

# Multipart uploads
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:25MB}

# Local product image storage
app.storage.products.root-path=${PRODUCT_IMAGES_ROOT_PATH:uploads/products}
app.storage.products.public-url-path=${PRODUCT_IMAGES_PUBLIC_PATH:/api/product-images}
app.storage.products.max-size-bytes=${PRODUCT_IMAGES_MAX_SIZE_BYTES:5242880}
app.storage.products.max-pixels=${PRODUCT_IMAGES_MAX_PIXELS:25000000}
app.storage.products.allowed-content-types=${PRODUCT_IMAGES_ALLOWED_TYPES:image/jpeg,image/png,image/webp}

# Security
security.jwt.secret=${JWT_SECRET:flower-details-local-development-secret-change-me-please-32bytes}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
security.jwt.issuer=${JWT_ISSUER:flower-details-api}
security.jwt.audience=${JWT_AUDIENCE:flower-details-web}
security.cookie.access-token-name=${AUTH_ACCESS_COOKIE_NAME:flower_details_access_token}
security.cookie.secure=${AUTH_COOKIE_SECURE:false}
security.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
security.cookie.path=${AUTH_COOKIE_PATH:/}
security.cookie.domain=${AUTH_COOKIE_DOMAIN:}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
security.authentication-rate-limit.max-attempts=${AUTH_RATE_LIMIT_MAX_ATTEMPTS:10}
security.authentication-rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
security.authentication-rate-limit.backend=${AUTH_RATE_LIMIT_BACKEND:memory}
security.authentication-rate-limit.redis-key-prefix=${AUTH_RATE_LIMIT_REDIS_KEY_PREFIX:flower-details:auth-rate-limit:}

# Initial admin for local development
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin.names=${BOOTSTRAP_ADMIN_NAMES:Administrador}
app.bootstrap.admin.last-names=${BOOTSTRAP_ADMIN_LAST_NAMES:Flower Details}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:sales@alxgarden.com}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin12345!}

# Logging
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.flower_details=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:INFO}
logging.level.org.hibernate.orm.jdbc.bind=${LOG_LEVEL_SQL_BIND:INFO}
logging.structured.format.console=${LOG_STRUCTURED_FORMAT:logstash}
