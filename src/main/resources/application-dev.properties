# Server
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

# Local PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flower_details}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=FlowerDetailsDevPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.highlight_sql=${HIBERNATE_HIGHLIGHT_SQL:true}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=${HIBERNATE_DEFAULT_BATCH_FETCH_SIZE:50}
spring.sql.init.mode=${SQL_INIT_MODE:never}

# Security
security.jwt.secret=${JWT_SECRET:flower-details-local-development-secret-change-me-please-32bytes}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
security.cookie.access-token-name=${AUTH_ACCESS_COOKIE_NAME:flower_details_access_token}
security.cookie.secure=${AUTH_COOKIE_SECURE:false}
security.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
security.cookie.path=${AUTH_COOKIE_PATH:/}
security.cookie.domain=${AUTH_COOKIE_DOMAIN:}

# Initial admin for local development
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin.names=${BOOTSTRAP_ADMIN_NAMES:Administrador}
app.bootstrap.admin.last-names=${BOOTSTRAP_ADMIN_LAST_NAMES:Flower Details}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:sales@alxgarden.com}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin12345!}

# Logging
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.flower_details=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:INFO}
logging.level.org.hibernate.orm.jdbc.bind=${LOG_LEVEL_SQL_BIND:INFO}
