spring.config.activate.on-profile=prod

server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=FlowerDetailsProductionPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

app.storage.products.root-path=${PRODUCT_IMAGES_ROOT_PATH}
app.storage.products.public-url-path=${PRODUCT_IMAGES_PUBLIC_PATH:/api/product-images}
app.storage.products.max-size-bytes=${PRODUCT_IMAGES_MAX_SIZE_BYTES:5242880}
app.storage.products.max-pixels=${PRODUCT_IMAGES_MAX_PIXELS:25000000}
app.storage.products.allowed-content-types=${PRODUCT_IMAGES_ALLOWED_TYPES:image/jpeg,image/png,image/webp}

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
security.jwt.issuer=${JWT_ISSUER:flower-details-api}
security.jwt.audience=${JWT_AUDIENCE:flower-details-web}
security.cookie.access-token-name=${AUTH_ACCESS_COOKIE_NAME:flower_details_access_token}
security.cookie.secure=true
security.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
security.cookie.path=/
security.cookie.domain=${AUTH_COOKIE_DOMAIN:}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
security.authentication-rate-limit.max-attempts=${AUTH_RATE_LIMIT_MAX_ATTEMPTS:10}
security.authentication-rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
security.authentication-rate-limit.backend=redis
security.authentication-rate-limit.redis-key-prefix=${AUTH_RATE_LIMIT_REDIS_KEY_PREFIX:flower-details:prod:auth-rate-limit:}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}

app.bootstrap.admin.enabled=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=true
management.metrics.tags.application=${spring.application.name}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.flower_details=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.structured.format.console=${LOG_STRUCTURED_FORMAT:logstash}
