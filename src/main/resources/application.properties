spring.application.name=flower-details

spring.jpa.open-in-view=false

server.shutdown=graceful

# Server
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

# Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=false
management.metrics.tags.application=flower-details

# API documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Local PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/flower_details
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=FlowerDetailsDevPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Multipart uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Local product image storage
app.storage.products.root-path=uploads/products
app.storage.products.public-url-path=/api/product-images
app.storage.products.max-size-bytes=5242880
app.storage.products.max-pixels=25000000
app.storage.products.allowed-content-types=image/jpeg,image/png,image/webp

# Security
security.jwt.secret=flower-details-local-development-secret-change-me-please-32bytes
security.jwt.expiration-minutes=1440
security.jwt.issuer=flower-details-api
security.jwt.audience=flower-details-web
security.cookie.access-token-name=flower_details_access_token
security.cookie.secure=false
security.cookie.same-site=Lax
security.cookie.path=/
security.cookie.domain=
security.cors.allowed-origins=http://localhost:4200
security.authentication-rate-limit.max-attempts=10
security.authentication-rate-limit.window-seconds=60
security.authentication-rate-limit.backend=memory
security.authentication-rate-limit.redis-key-prefix=flower-details:auth-rate-limit:

# Initial admin for local development
app.bootstrap.admin.enabled=true
app.bootstrap.admin.names=Administrador
app.bootstrap.admin.last-names=Flower Details
app.bootstrap.admin.email=sales@alxgarden.com
app.bootstrap.admin.password=Admin12345!

# Logging
logging.level.root=INFO
logging.level.com.flower_details=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.structured.format.console=logstash
