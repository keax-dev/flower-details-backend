spring.profiles.active=test
debug=false

spring.datasource.url=jdbc:h2:mem:flower_details_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

app.storage.products.root-path=target/test-uploads/products
app.storage.products.public-url-path=/api/product-images
app.storage.products.max-size-bytes=5242880
app.storage.products.max-pixels=25000000
app.storage.products.allowed-content-types=image/jpeg,image/png,image/webp

security.jwt.secret=flower-details-test-secret-change-me-please-32bytes
security.jwt.expiration-minutes=60
security.jwt.issuer=flower-details-test
security.jwt.audience=flower-details-test-web
security.cookie.access-token-name=flower_details_test_access_token
security.cookie.secure=false
security.cookie.same-site=Lax
security.cookie.path=/
security.cookie.domain=
security.cors.allowed-origins=http://localhost:4200
security.authentication-rate-limit.max-attempts=1000
security.authentication-rate-limit.window-seconds=60
security.authentication-rate-limit.backend=memory
security.authentication-rate-limit.redis-key-prefix=flower-details:test:auth-rate-limit:

app.bootstrap.admin.enabled=false

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
